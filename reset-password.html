<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MFG Advisory — Nulstil adgangskode</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<div class="login-screen" id="loginScreen" style="display:flex">
  <div class="login-box" id="resetBox">
    <h1>MFG Advisory</h1>
    <p>Vælg en ny adgangskode til adminpanelet.</p>
    <input type="password" id="newPasswordInput" autocomplete="new-password" placeholder="Ny adgangskode (mindst 8 tegn)">
    <input type="password" id="newPasswordConfirm" autocomplete="new-password" placeholder="Gentag ny adgangskode">
    <button class="btn btn-primary" id="resetSubmit" style="width:100%">Gem ny adgangskode</button>
    <div class="login-error" id="resetError"></div>
    <div class="login-success" id="resetSuccess" style="display:none"></div>
  </div>
  <div class="login-box" id="resetInvalidBox" style="display:none">
    <h1>Linket er ugyldigt eller udløbet</h1>
    <p>Nulstillingslinket virker ikke længere. Gå til adminpanelet og bed om et nyt.</p>
    <a class="btn btn-outline" href="admin.html" style="width:100%;display:block;text-align:center;text-decoration:none">Til adminpanelet</a>
  </div>
</div>

<script src="assets/js/supabase-config.js"></script>
<script src="assets/js/vendor/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script>
(function () {
  const resetBox = document.getElementById('resetBox');
  const invalidBox = document.getElementById('resetInvalidBox');
  const errorEl = document.getElementById('resetError');
  const successEl = document.getElementById('resetSuccess');

  async function init() {
    if (!window.MFGSupabase) {
      errorEl.textContent = 'Supabase er ikke konfigureret.';
      return;
    }
    // Supabase's recovery-link opretter automatisk en midlertidig session,
    // når siden åbnes (token i URL-fragmentet). Vi tjekker blot, at den findes.
    const { data } = await window.MFGSupabase.auth.getSession();
    if (!data || !data.session) {
      resetBox.style.display = 'none';
      invalidBox.style.display = 'block';
    }
  }

  document.getElementById('resetSubmit').addEventListener('click', async () => {
    const pw1 = document.getElementById('newPasswordInput').value;
    const pw2 = document.getElementById('newPasswordConfirm').value;
    errorEl.textContent = '';
    successEl.style.display = 'none';

    if (pw1.length < 8) {
      errorEl.textContent = 'Adgangskoden skal være mindst 8 tegn.';
      return;
    }
    if (pw1 !== pw2) {
      errorEl.textContent = 'De to adgangskoder er ikke ens.';
      return;
    }
    const { error } = await window.MFGSupabase.auth.updateUser({ password: pw1 });
    if (error) {
      errorEl.textContent = 'Kunne ikke gemme ny adgangskode: ' + error.message;
      return;
    }
    successEl.textContent = 'Adgangskoden er opdateret. Du kan nu logge ind med den.';
    successEl.style.display = 'block';
    document.getElementById('newPasswordInput').value = '';
    document.getElementById('newPasswordConfirm').value = '';
  });

  init();
})();
</script>
</body>
</html>
